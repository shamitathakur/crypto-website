<!DOCTYPE html>
<html>
<head>
    <title>Cryptography Tool</title>

    <!-- Stylish Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px;
            font-size: 22px;
            font-weight: 600;
            color: #f5d76e;
            letter-spacing: 1px;
        }

        /* Card */
        .container {
            width: 420px;
            margin: 40px auto;
            background: #2c2c3a;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            color: #eee;
        }

        /* Tabs */
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #444;
        }

        .tabs button {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            color: #bbb;
            transition: 0.3s;
        }

        .tabs button:hover {
            color: #f5d76e;
        }

        .tabs button.active {
            border-bottom: 2px solid #f5d76e;
            color: #f5d76e;
        }

        h3 {
            margin-bottom: 10px;
            font-weight: 500;
            color: #fff;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border-radius: 8px;
            border: 1px solid #555;
            background: #1f1f2e;
            color: white;
            font-family: 'Montserrat', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: #f5d76e;
        }

        .action {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #f5d76e;
            color: #222;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .action:hover {
            background: #e6c84f;
        }

        #output {
            margin-top: 15px;
            background: #1f1f2e;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            color: #ddd;
        }
    </style>
</head>

<body>

<div class="header">🔐 Cryptography Tool</div>

<div class="container">

    <div class="tabs">
        <button onclick="setTab(this,'vigenere')" class="active">Vigenère</button>
        <button onclick="setTab(this,'rail')">Rail Fence</button>
        <button onclick="setTab(this,'rsa')">RSA</button>
    </div>

    <div id="content"></div>

</div>

<script>
function setTab(btn, type) {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    show(type);
}

window.onload = () => show('vigenere');
</script>

<script src="script.js"></script>

</body>
</html>
